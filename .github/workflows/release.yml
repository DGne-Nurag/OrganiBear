# Release: Ein Tag wie v0.1.0 baut alle Plattformen und legt ein GitHub-Release
# mit den Programmen und SHA256SUMS an.
#
#   git tag v0.1.0 && git push origin v0.1.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - run: go vet ./...
      - run: go test ./...
      # Lizenztexte der eingebauten Bibliotheken (MIT/BSD/Apache verlangen sie bei Binärweitergabe)
      - run: mkdir -p dist && scripts/notices.sh > dist/THIRD_PARTY_NOTICES.txt
      - uses: actions/upload-artifact@v7
        with:
          name: notices
          path: dist/THIRD_PARTY_NOTICES.txt

  build:
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { goos: windows, goarch: amd64, kind: desktop, runner: ubuntu-latest, name: OrganiBear-Windows.exe }
          - { goos: darwin, goarch: arm64, kind: desktop, runner: macos-latest, name: OrganiBear-Mac-AppleSilicon }
          - { goos: darwin, goarch: amd64, kind: desktop, runner: macos-latest, name: OrganiBear-Mac-Intel }
          - { goos: linux, goarch: amd64, kind: desktop, runner: ubuntu-latest, name: OrganiBear-Linux }
          - { goos: linux, goarch: arm64, kind: desktop, runner: ubuntu-24.04-arm, name: OrganiBear-Linux-ARM }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - name: GTK und WebKit für das Linux-Fenster
        if: matrix.goos == 'linux' && matrix.kind == 'desktop'
        run: sudo apt-get update -q && sudo apt-get install -yq libgtk-3-dev libwebkit2gtk-4.1-dev
      # Die App-Keys (OpenSubtitles, TheTVDB) kommen aus Secrets und stehen nie im Repo.
      - run: |
          if [ -z "$OS_KEY" ]; then echo "::warning::Secret OPENSUBTITLES_API_KEY fehlt, das Release kann keine Untertitel laden"; fi
          if [ -z "$TVDB_KEY" ]; then echo "::warning::Secret THETVDB_API_KEY fehlt, das Release kann TheTVDB nicht nutzen"; fi
          scripts/build.sh "dist/${NAME}"
        env:
          OS_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
          TVDB_KEY: ${{ secrets.THETVDB_API_KEY }}
          VERSION: ${{ github.ref_name }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          KIND: ${{ matrix.kind }}
          NAME: ${{ matrix.name }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7 # für den Download-Text
        with:
          sparse-checkout: .github
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Prüfsummen
        working-directory: dist
        run: sha256sum OrganiBear-* THIRD_PARTY_NOTICES.txt > SHA256SUMS && cat SHA256SUMS
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--generate-notes --notes-file .github/release-download.md --title "OrganiBear ${GITHUB_REF_NAME}")
          # Tags mit Bindestrich (v0.2.0-rc1) gelten als Vorabversion
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag "${flags[@]}"
