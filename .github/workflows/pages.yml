name: Webseite

# Baut die Webseite aus site/ und veröffentlicht sie auf GitHub Pages.
# Bilder kommen aus dem Programm selbst (Symbol, Screenshot, Tour), damit sie
# nie auseinanderlaufen. Einmalig nötig: Settings › Pages › Source „GitHub Actions“.

on:
  push:
    branches: [main]
    paths: [site/**, docs/screenshot.png, web/icon.png, web/tour/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          mkdir -p _site/tour
          cp site/* _site/
          cp docs/screenshot.png web/icon.png _site/
          cp web/tour/*.jpg _site/tour/
      # Echte Größe des Screenshots eintragen. Ohne feste Höhe verschiebt sich
      # die Seite, wenn das Bild nachlädt, und Sprungmarken landen zu weit oben.
      - run: |
          python3 - <<'PY'
          import re, struct
          w, h = struct.unpack(">II", open("_site/screenshot.png", "rb").read(24)[16:24])
          p = "_site/index.html"
          s = open(p, encoding="utf-8").read()
          s, n = re.subn(r'(src="screenshot.png"[^>]*?) width="\d+" height="\d+"', rf'\1 width="{w}" height="{h}"', s)
          assert n == 1, "Screenshot-Tag nicht gefunden"
          open(p, "w", encoding="utf-8").write(s)
          PY
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
